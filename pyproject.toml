[project]
name = "loc"
version = "0.1.0"
description = "Count lines of code from GitHub pull requests"
readme = "README.md"
authors = [{ name = "Bas Nijholt", email = "bas@nijho.lt" }]
requires-python = ">=3.12"
dependencies = ["typer>=0.15", "httpx>=0.28", "rich>=13", "diskcache>=5"]

[project.scripts]
loc = "loc:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loc"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # pydocstyle
    "ANN",     # annotations
    "COM812",  # trailing comma
    "ISC001",  # implicit string concat
    "T20",     # print statements (we use them for CLI)
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[dependency-groups]
dev = ["mypy>=1.14", "pre-commit>=4", "ruff>=0.9"]
